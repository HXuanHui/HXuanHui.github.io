name: Build Quartz Site

on:
  # 只在 v4 分支 push / PR 時觸發
  push:
    branches: ["v4"]
  pull_request:
    branches: ["v4"]
  # 也可以在 Actions tab 手動觸發
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Quartz
        uses: konstfish/quartz-build-action@v5
        with:
          # 這裡改成你 Markdown 的資料夾，例如 content 或 docs
          source: content
          # 如果有客製就填實際路徑，沒有就先刪掉這兩行
          quartz_config: quartz.config.ts
          quartz_layout: quartz.layout.ts
          page_title: "HXuanHui Notes"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
