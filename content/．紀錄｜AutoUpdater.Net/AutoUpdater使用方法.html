<header>AutoUpdater使用方法</header>
<h2 id="2-%E5%BB%BA%E7%AB%8B%E4%BC%BA%E6%9C%8D%E5%99%A8%E4%B8%8A%E7%9A%84-xml-%E6%9B%B4%E6%96%B0%E6%AA%94%E6%A1%88"><strong>2. 建立伺服器上的 XML 更新檔案</strong></h2>
<p>在伺服器上準備一個 XML 檔案，包含更新資訊。官網範例檔案（update.xml）如下：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-xml"><span class="hljs-meta">&lt;?xml version=<span class="hljs-string">&quot;1.0&quot;</span> encoding=<span class="hljs-string">&quot;UTF-8&quot;</span>?&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">item</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">version</span>&gt;</span>2.0.0.0<span class="hljs-tag">&lt;/<span class="hljs-name">version</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">url</span>&gt;</span>https://rbsoft.org/downloads/AutoUpdaterTest.zip<span class="hljs-tag">&lt;/<span class="hljs-name">url</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">changelog</span>&gt;</span>https://github.com/ravibpatel/AutoUpdater.NET/releases<span class="hljs-tag">&lt;/<span class="hljs-name">changelog</span>&gt;</span>
  <span class="hljs-tag">&lt;<span class="hljs-name">mandatory</span>&gt;</span>false<span class="hljs-tag">&lt;/<span class="hljs-name">mandatory</span>&gt;</span>
<span class="hljs-tag">&lt;/<span class="hljs-name">item</span>&gt;</span>
</code></pre>

<ul>
<li>
<p><code>&lt;version&gt;</code>：你要釋出的新版本號。</p>
</li>
<li>
<p><code>&lt;url&gt;</code>：新版安裝程式或壓縮檔下載網址。</p>
</li>
<li>
<p><code>&lt;changelog&gt;</code>：更新內容說明頁（可省略）。</p>
</li>
<li>
<p><code>&lt;mandatory&gt;</code>：是否強制更新（true/false，也可在程式內設定請，參閱第6頁）。</p>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="AutoUpdater使用方法" lang="zh-TW" data-marpit-pagination="3" style="--paginate:true;--header:AutoUpdater使用方法;" data-marpit-pagination-total="8">
<header>AutoUpdater使用方法</header>
<h3 id="21-xml-%E6%9B%B4%E6%96%B0%E6%AA%94%E6%A1%88%E5%AF%A6%E9%9A%9B%E6%93%8D%E4%BD%9C">2.1 XML 更新檔案實際操作</h3>
<p>本地demo:</p>
<ol>
<li>
<p>在電腦資料夾建立一個檔案 <code>update.xml</code>。</p>
</li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="AutoUpdater使用方法" lang="zh-TW" data-marpit-pagination="4" style="--paginate:true;--header:AutoUpdater使用方法;" data-marpit-pagination-total="8">
<header>AutoUpdater使用方法</header>
<h2 id="3-%E5%9C%A8%E7%A8%8B%E5%BC%8F%E5%95%9F%E5%8B%95%E6%99%82%E6%AA%A2%E6%9F%A5%E6%9B%B4%E6%96%B0"><strong>3. 在程式啟動時檢查更新</strong></h2>
<p>WinForms 範例：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-csharp"><span class="hljs-keyword">using</span> AutoUpdaterDotNET;

<span class="hljs-function"><span class="hljs-keyword">private</span> <span class="hljs-keyword">void</span> <span class="hljs-title">Form1_Load</span>(<span class="hljs-params"><span class="hljs-built_in">object</span> sender, EventArgs e</span>)</span>
{
    AutoUpdater.Start(<span class="hljs-string">&quot;https://yourdomain.com/update.xml&quot;</span>); <span class="hljs-comment">// 每次啟動都檢查更新</span>
}

</code></pre>
<p>加在程式啟動的地方（例如 MainForm 的 Load event），即可每次啟動都檢查更新。</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="AutoUpdater使用方法" lang="zh-TW" data-marpit-pagination="5" style="--paginate:true;--header:AutoUpdater使用方法;" data-marpit-pagination-total="8">
<header>AutoUpdater使用方法</header>
<h2 id="4-%E9%80%B2%E9%9A%8E%E8%A8%AD%E5%AE%9A%E5%8F%AF%E9%81%B8"><strong>4. 進階設定（可選）</strong></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-csharp"><span class="hljs-keyword">using</span> AutoUpdaterDotNET;

<span class="hljs-function"><span class="hljs-keyword">private</span> <span class="hljs-keyword">void</span> <span class="hljs-title">Form1_Load</span>(<span class="hljs-params"><span class="hljs-built_in">object</span> sender, EventArgs e</span>)</span>
{
    SetupAutoUpdater(); <span class="hljs-comment">// 每次啟動都檢查更新</span>
}

</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-T5Uiax7U="" data-paginate="true" data-header="AutoUpdater使用方法" lang="zh-TW" data-marpit-pagination="6" style="--paginate:true;--header:AutoUpdater使用方法;" data-marpit-pagination-total="8">
<header>AutoUpdater使用方法</header>
<h2 id="4-%E9%80%B2%E9%9A%8E%E8%A8%AD%E5%AE%9A%E5%8F%AF%E9%81%B8contd"><strong>4. 進階設定（可選）（Cont'd）</strong></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-csharp"><span class="hljs-function"><span class="hljs-keyword">private</span> <span class="hljs-keyword">void</span> <span class="hljs-title">SetupAutoUpdater</span>()</span>
{
    <span class="hljs-comment">// 設定應用程式標題</span>
    AutoUpdater.AppTitle = <span class="hljs-string">&quot;您的系統&quot;</span>;
    
    <span class="hljs-comment">// 設定是否顯示略過按鈕</span>
    AutoUpdater.ShowSkipButton = <span class="hljs-literal">false</span>;
    
    <span class="hljs-comment">// 設定是否顯示稍後提醒按鈕</span>
    AutoUpdater.ShowRemindLaterButton = <span class="hljs-literal">true</span>;
    
    <span class="hljs-comment">// 設定稍後提醒的時間間隔（分鐘）</span>
    AutoUpdater.RemindLaterTimeSpan = RemindLaterFormat.Minutes;
    AutoUpdater.RemindLaterAt = <span class="hljs-number">30</span>;
    
    <span class="hljs-comment">// 設定是否強制更新</span>
    AutoUpdater.Mandatory = <span class="hljs-literal">false</span>;
    
    <span class="hljs-comment">// 設定下載對話框的模式</span>
    AutoUpdater.DownloadPath = Environment.CurrentDirectory;
    
    <span class="hljs-comment">// 開始檢查更新</span>
    AutoUpdater.Start(<span class="hljs-string">&quot;http://your-server.com/version.xml&quot;</span>);
}
</code></pre>

<h2 id="5-%E7%89%88%E6%9C%AC%E8%99%9F%E7%AE%A1%E7%90%86">5. 版本號管理</h2>
<p>製作完新版本的程式，在 <code>AssemblyInfo.cs</code> 中設定版本號：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-csharp">[<span class="hljs-meta">assembly: AssemblyVersion(<span class="hljs-string">&quot;1.0.0.0&quot;</span>)</span>]

</code></pre>
